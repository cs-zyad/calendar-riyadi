<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نادي ريادة الأعمال</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* base reset (was supplied by the claude.ai host page) */
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
/* Layout: RTL single-page club site. Dark navy field, emerald calendar green, one gold accent for "now". */
:root{
  --bg:#0f1233; --bg2:#161a45; --panel:#1b1f50; --line:#2b3070;
  --fg:#f1f2fb; --mute:#a7abd6;
  --emerald:#0c7a5a; --emerald-d:#075c44; --mint:#8ff0c4;
  --gold:#e6c45a; --gold-t:#e6c45a; --ink:#1a1630;
  --glow1:#232a80; --glow2:#0c3a4d55; --wn:#0c1030; --hov:#ffffff08; --sel:#e6c45a14;
  --pri:#e6c45a; --pri-t:#1a1630; --hd:#0c7a5a; --sh:none; --logo-f:none; --ovl:#05061ccc; --dg:#ff9aa5; --dgl:#b23a48; --note-bg:#e6c45a1f; --note-bd:#e6c45a55;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--fg);font:400 16px/1.8 var(--f-body);direction:rtl;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(60rem 30rem at 85% -5%,var(--glow1) 0%,transparent 60%),radial-gradient(40rem 25rem at 0% 40%,var(--glow2) 0%,transparent 70%);
}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand svg{width:44px;height:44px}
.brand b{font:600 17px/1.2 var(--f-display);display:block}
.brand small{color:var(--mute);font-size:11px;letter-spacing:.06em;direction:ltr;display:block;text-align:right}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--mute);padding:6px 12px;border-radius:999px;font-size:14px}
nav a:hover{color:var(--fg);background:var(--panel)}
nav a.cta{background:var(--pri);color:var(--pri-t);font-weight:600}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;padding-block:48px 56px}
.eyebrow{color:var(--mint);font-size:13px;letter-spacing:.04em}
.hero h1{font-size:clamp(34px,5.6vw,64px);font-weight:700;margin-block:12px 16px}
.hero h1 em{font-style:normal;color:var(--gold-t)}
.hero p{color:var(--mute);max-width:34em;margin:0 0 24px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 22px;border-radius:12px;text-decoration:none;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;font:600 15px var(--f-body)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-t)}
.btn:hover{filter:brightness(1.1)}
.next{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;min-width:0}
.next h3{font-size:14px;color:var(--mute);font-weight:500;margin-bottom:12px}
.next .t{font:600 24px/1.4 var(--f-display)}
.next .d{color:var(--mint);margin-top:6px;font-size:14px}
.next ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.next li{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mute)}
.next li b{color:var(--fg);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}
.stats div{padding:22px 8px;text-align:center}
.stats div+div{border-inline-start:1px solid var(--line)}
.stats b{display:block;font:700 34px/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{color:var(--mute);font-size:14px}
section{padding-block:24px 8px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sh h2{font-size:clamp(26px,3.6vw,38px)}
.sh p{color:var(--mute);margin:6px 0 0;max-width:36em}
/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.cat{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
.cat i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:8px}
.cat h3{font-size:18px;margin-bottom:6px}
.cat p{margin:0;color:var(--mute);font-size:14px}
.cat small{display:block;margin-top:10px;color:var(--fg);font-size:13px}
/* signature */
.sig{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
.card{border-radius:20px;padding:26px;background:var(--blue);min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.card.big{grid-row:span 2;background:linear-gradient(160deg,#2a2fd0,#171a86);min-height:300px}
.card h3{font-size:clamp(22px,3vw,34px)}
.card.big h3{font-size:clamp(30px,4.4vw,52px)}
.card p{margin:8px 0 0;opacity:.88;font-size:14px}
.card .when{font-size:13px;color:#8ff0c4}
.card.g{background:var(--emerald-d)}.card.y{background:#6d6420}.card.p{background:#4d2fb0}
/* schedule */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--bg2);color:var(--mute);padding:6px 14px;border-radius:999px;cursor:pointer;font:500 14px var(--f-body)}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.month{margin-bottom:34px}
.month h3{font-size:20px;color:var(--mint);margin-bottom:12px}
.row{display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.row.done .tt{color:var(--mute)}
.dt{font-variant-numeric:tabular-nums;font-weight:600}
.dt small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.tt{font-weight:500;min-width:0}
.tt small{display:block;color:var(--mute);font-weight:400;font-size:13px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.ok{color:var(--mint);margin-inline-start:6px}
.now{border-inline-start:3px solid var(--gold);background:linear-gradient(270deg,var(--sel),transparent)}
.ac{color:var(--mute);font-size:13px;padding:10px 4px;border-bottom:1px dashed var(--line);display:flex;gap:10px}
.ac b{font-weight:500;color:var(--fg)}
/* month calendar */
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.mt{font:600 24px var(--f-display)}.mt small{display:block;font:400 13px var(--f-body);color:var(--mute)}
.nv{display:flex;gap:6px;align-items:center}
.ib{box-shadow:var(--sh);background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 14px;cursor:pointer;font:500 14px var(--f-body)}
.ib:hover{border-color:var(--mute)}
.mg{box-shadow:var(--sh);display:grid;grid-template-columns:38px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg2)}
.mg>div{border-inline-start:1px solid var(--line);border-top:1px solid var(--line)}
.wh{background:var(--hd);color:#fff;text-align:center;font:600 13px var(--f-display);padding:8px 2px;border-top:0!important}
.wn{display:grid;place-items:center;color:var(--mint);font:600 12px var(--f-display);background:var(--wn)}
.dc{min-height:116px;padding:6px 5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;position:relative}
.dc:hover{background:var(--hov)}
.dc.out{opacity:.45}
.dc.out:hover{opacity:.7}
.dc.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--gold)}
.dn{display:flex;justify-content:space-between;font:600 13px var(--f-display);font-variant-numeric:tabular-nums}
.dn small{color:var(--mute);font:400 10px var(--f-body)}
.dc.td .dn b{background:var(--pri);color:var(--pri-t);border-radius:999px;padding:0 7px}
.chp{border-radius:6px;padding:2px 6px;color:#fff;font:500 11.5px/1.45 var(--f-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border:0;text-align:start;width:100%}
.chp.dn2{opacity:.65}
.more{font-size:11px;color:var(--mute)}
.ag{box-shadow:var(--sh);margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.ag h3{font-size:17px;margin-bottom:10px}
.ae{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ae .tag{flex:none}.ae span.n{flex:1;min-width:0}
.ab{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.pl h3{display:flex;align-items:center;gap:8px}
.pl .cnt{font:600 12px var(--f-body);background:#e08a2c;color:#1a1630;border-radius:999px;padding:1px 9px}
.pl .hint{color:var(--mute);font-size:13px;margin:0 0 6px}
.pl .ae .n small{display:block;color:var(--mute);font-weight:400;font-size:12.5px}
.dtag{font-size:11px;background:var(--emerald);color:#fff;border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.logo{display:block;height:84px;width:auto;margin:0 auto;filter:var(--logo-f)}
.lh{display:flex;justify-content:center;padding-block:22px 6px}
[data-jump],[data-filter]{cursor:pointer}
[data-jump]:hover,[data-filter]:hover{border-color:var(--mute)}
.card[data-jump]:hover{filter:brightness(1.12)}
.kb{display:grid;gap:5px}
.kr{display:flex;gap:5px;justify-content:center}
.kr button{flex:1;min-width:0;padding:9px 0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;font:500 16px var(--f-body);cursor:pointer}
.kr button:hover{border-color:var(--mute)}
.kr .wide{flex:3}
.sec{-webkit-text-security:disc;text-security:disc}
textarea{resize:vertical;min-height:70px}
.nt{display:grid;gap:12px}
input[type=color]{height:44px;padding:3px;cursor:pointer}
.ib.th{font-size:13px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lg{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--mute);font-size:13px}
.lg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px}
.note{background:var(--note-bg);border:1px solid var(--note-bd);color:var(--gold-t);padding:8px 14px;border-radius:10px;font-size:13px;margin-bottom:14px}
.ov{position:fixed;inset:0;background:var(--ovl);display:grid;place-items:center;padding:16px;z-index:50}
.ov[hidden]{display:none}
.md{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(460px,100%);display:grid;gap:12px;max-height:100%;overflow:auto}
.md h3{font-size:20px}
.md .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.btn.dg{border-color:var(--dgl);color:var(--dg)}
#mdBtn{justify-self:start}
.md2{display:grid;gap:8px}
.mdr{display:flex;gap:8px}.mdr input{flex:1;min-width:0}
.mdl{display:flex;flex-wrap:wrap;gap:6px}
.mdc{display:inline-flex;align-items:center;gap:4px;background:var(--sel);border:1px solid var(--gold);border-radius:999px;padding:2px 4px 2px 12px;font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}
.mdc button{border:0;background:transparent;color:var(--mute);font-size:17px;line-height:1;cursor:pointer;width:28px;height:28px;border-radius:50%}
.mdc button:hover{color:var(--fg);background:#ffffff14}
.mdh{color:var(--mute);font-size:13px}
.ckr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ck{display:flex;gap:6px;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:6px 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:13px;line-height:1.4;color:var(--fg);cursor:pointer;min-width:0}
.ck input{width:auto;flex:none;margin:0;accent-color:var(--gold)}
.ck:has(input:checked){border-color:var(--gold);background:var(--sel)}
.ck:has(#epost:checked){border-color:#e08a2c;background:#e08a2c26}
@media(max-width:700px){
 :root:root:root .chp{background:var(--c)!important;border:0!important}
 .dc{min-height:58px;padding:4px 2px;align-items:center}
 .dn small{display:none}
 .chp{font-size:0;height:6px;padding:0;border-radius:3px}
 .more{font-size:10px}
 .mg{grid-template-columns:24px repeat(7,minmax(0,1fr))}
 .wh{font-size:12px;padding:8px 0}
 .wh .wl{display:none}.wh .ws{display:inline}
 .filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:16px;-webkit-mask-image:linear-gradient(to left,#000 88%,transparent);mask-image:linear-gradient(to left,#000 88%,transparent)}
 .filters::-webkit-scrollbar{display:none}
 .chip{flex:none;padding:8px 14px}
 .bar{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center}
 .nv{display:contents}
 .mt{font-size:21px}
 .ib{min-height:44px;min-width:44px;padding:8px 12px}
 #addBtn{grid-column:1/-1;width:100%;min-height:48px}
 #outBtn{grid-column:1/-1}
 .lg{display:none}
 .ag{padding:16px}
 .ae{flex-wrap:wrap;row-gap:6px}
 .ae span.n{flex:1 1 60%}
 input,select,textarea{font-size:16px}
 .ov{place-items:end center;padding:0}
 .md{width:100%;border-radius:22px 22px 0 0;border-bottom:0;max-height:92vh;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
 .md .acts .btn{flex:1;min-height:48px}
 .kr button{padding:11px 0}
}
.ws{display:none}
/* ===== polish layer ===== */
.lh{padding-block:26px 2px}
.logo{height:70px}
.ttl{display:grid;justify-items:center;gap:8px;text-align:center;margin:6px 0 22px}
.slg{display:flex;align-items:center;gap:12px;margin:0;color:var(--gold);font:600 14px/1.4 var(--f-display);letter-spacing:.08em}
.slg::before,.slg::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.slg::after{transform:scaleX(-1)}
.ttl h1{font:700 clamp(22px,3.2vw,30px)/1.3 var(--f-display);letter-spacing:-.01em}
.sem{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 10px;color:var(--mute);font-size:13px}
.sem b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.sem .dot{width:4px;height:4px;border-radius:50%;background:var(--line)}
.sem .pb{width:110px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.sem .pb i{display:block;height:100%;border-radius:inherit;background:linear-gradient(270deg,var(--mint),var(--emerald))}
#note:empty{display:none}
.note{display:flex;align-items:center;gap:8px;width:fit-content;max-width:100%;margin:0 auto 18px;padding:6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mute);font-size:12.5px;line-height:1.6}
.note::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px #e6c45a2e}
.filters{justify-content:center}
.chip{transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--mute);color:var(--fg)}
.chip[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.bar{margin:6px 0 16px}
.mt{font-size:28px;line-height:1.25}
.mt small{margin-top:2px}
.ib{border-radius:12px;transition:border-color .15s,background .15s}
.ib:hover{background:#262b66}
#outBtn{background:transparent;color:var(--mute)}
#outBtn:hover{color:var(--fg)}
.mg{border-radius:20px;box-shadow:0 24px 60px -36px #000c}
.wh{background:#121640;color:var(--mint);font:600 12.5px var(--f-display);padding:12px 2px 11px;letter-spacing:.01em}
.wh:first-child{background:#121640}
.wn{background:#121640;color:var(--mute);font:500 11px var(--f-display);opacity:.8}
.dc{padding:8px 6px 6px;gap:4px;transition:background .12s}
.dc.we{background:#ffffff05}
.dn b{font-size:14px;font-weight:600}
.dc.td{background:linear-gradient(180deg,#e6c45a17,transparent 70%)}
.dc.td .dn b{box-shadow:0 0 0 3px #e6c45a33}
.dc.sel{background:var(--sel);box-shadow:inset 0 0 0 2px var(--gold);border-radius:4px}
.ag{border-radius:20px;padding:20px 22px;box-shadow:0 18px 40px -32px #000c}
.ag h3{font-size:18px;margin-bottom:12px}
.ae{padding:12px 0}
.ae .ib{padding:6px 14px;font-size:13px}
.pl{border-color:#e08a2c4d;background:linear-gradient(180deg,#e08a2c14,transparent 55%),var(--panel)}
.lg{justify-content:center;margin-top:18px}
@media(min-width:701px){
 .chp{background:color-mix(in srgb,var(--c) 26%,var(--bg2))!important;color:var(--fg)!important;border-inline-start:3px solid var(--c)!important;border-radius:5px;padding:3px 7px;transition:background .12s}
 .chp:hover{background:color-mix(in srgb,var(--c) 42%,var(--bg2))!important}
 .chp.dn2{opacity:.55}
 .tag{background:color-mix(in srgb,var(--c) 26%,transparent)!important;color:var(--fg)!important;border:1px solid color-mix(in srgb,var(--c) 70%,transparent)}
}
@media(max-width:700px){
 .lh{padding-block:18px 0}.logo{height:58px}
 .ttl{margin-bottom:16px}.ttl h1{font-size:22px}
 .sem .pb{width:80px}
 .note{font-size:12px;border-radius:14px}
 .filters{justify-content:flex-start}
 .mt{font-size:22px}
 .mg{border-radius:16px}
 .dc.sel{border-radius:0}
 .ag{padding:16px;border-radius:16px}
}
.chip i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:7px;vertical-align:middle}
/* guests */
.guests{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.g1{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:center;min-width:0}
.av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:700 20px var(--f-display)}
.g1 b{display:block;font-weight:600}.g1 span{color:var(--mute);font-size:13px}
/* join */
.join{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:1fr 1fr;gap:32px}
form{display:grid;gap:12px;min-width:0}
label{font-size:13px;color:var(--mute);display:grid;gap:4px}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:400 15px var(--f-body);width:100%}
.msg{color:var(--mint);min-height:1.5em;font-size:14px}
footer{margin-top:72px;border-top:1px solid var(--line);padding-block:28px;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:820px){
  .hero,.join{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats div:nth-child(3){border-inline-start:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--line)}
  .sig{grid-template-columns:1fr}.card.big{grid-row:auto;min-height:220px}
  .row{grid-template-columns:76px 1fr}.row .tag{grid-column:2;justify-self:start}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* on-screen Arabic keyboard + Latin-key fallback */
var AR={q:"ض",w:"ص",e:"ث",r:"ق",t:"ف",y:"غ",u:"ع",i:"ه",o:"خ",p:"ح","[":"ج","]":"د",a:"ش",s:"س",d:"ي",f:"ب",g:"ل",h:"ا",j:"ت",k:"ن",l:"م",";":"ك","'":"ط",z:"ئ",x:"ء",c:"ؤ",v:"ر",n:"ى",m:"ة",",":"و",".":"ز","/":"ظ"};
function latinToAr(v){return v.replace(/b/gi,"لا").replace(/[A-Za-z\[\];',.\/]/g,function(c){return AR[c.toLowerCase()]||c})}

buildKb();

/* secret PIN gate */
var fbMode=false,fbAuth=null,fbU=null,fbSeed=null,unlocked=false,pinDoc=undefined,tries=0,lockUntil=0,gateCb=null,ov3=document.getElementById("ov3");
function nz(v){return v.normalize("NFC").replace(/[\u064B-\u065F\u0640\u0670]/g,"").replace(/ة/g,"ه").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/\s+/g,"").toLowerCase()}
async function sha(pin,salt){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+nz(pin)));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function gate(cb){
  if(unlocked){cb();return}
  if(fbMode)pinDoc={fb:1};
  if(db&&pinDoc===undefined){try{var sn=await db.doc("config/pin").get();pinDoc=sn.exists?sn.data():null}catch(e){}}
  if(pinDoc===undefined)pinDoc=null;
  gateCb=cb;var setMode=!pinDoc;
  document.getElementById("ph").textContent="كلمة سر";
  if(fbMode){var ppx=document.getElementById("pp");ppx.type="password";ppx.classList.remove("sec");ppx.setAttribute("autocomplete","current-password");ppx.maxLength=128;
    document.getElementById("pel").hidden=false;document.getElementById("kbt").hidden=true;document.getElementById("kb").hidden=true;
    document.getElementById("ph").textContent="تسجيل دخول المحرر"}
  document.getElementById("phint").hidden=true;
  document.getElementById("pp2l").hidden=!setMode;
  document.getElementById("pp").value="";document.getElementById("pp2").value="";document.getElementById("pmsg").textContent="";
  ov3.hidden=false;document.getElementById(fbMode&&!document.getElementById("pe").value?"pe":"pp").focus();
}
function closeGate(){ov3.hidden=true;gateCb=null}
document.getElementById("pcancel").onclick=closeGate;
ov3.addEventListener("click",function(ev){if(ev.target===ov3)closeGate()});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!ov3.hidden)closeGate()});
document.getElementById("pf").addEventListener("submit",async function(ev){
  ev.preventDefault();var m=document.getElementById("pmsg"),v=document.getElementById("pp").value.trim(),setMode=!pinDoc;
  if(fbMode){
    var em=document.getElementById("pe").value.trim(),pw=document.getElementById("pp").value;
    if(!em||!pw){m.textContent="اكتب الإيميل وكلمة السر.";return}
    if(Date.now()<lockUntil){m.textContent="محاولات كثيرة. انتظر نصف دقيقة وحاول مجدداً.";return}
    m.textContent="جارٍ تسجيل الدخول…";
    try{await fbU.signInWithEmailAndPassword(fbAuth,em,pw)}
    catch(e){var c=e&&e.code;
      if(c==="auth/too-many-requests")m.textContent="محاولات كثيرة. انتظر قليلاً وحاول مجدداً.";
      else if(c==="auth/network-request-failed")m.textContent="تعذر الاتصال. تأكد من الإنترنت وحاول مجدداً.";
      else{tries++;if(tries>=5){tries=0;lockUntil=Date.now()+30000}m.textContent="الإيميل أو كلمة السر غير صحيحة."}
      return}
    tries=0;unlocked=true;var cb1=gateCb;closeGate();if(fbSeed)fbSeed();if(cb1)cb1();return}
  if(v.length<4||v.length>40){m.textContent="كلمة السر من 4 إلى 40 حرفاً.";return}
  if(!(window.crypto&&crypto.subtle)){m.textContent="المتصفح لا يدعم التحقق من كلمة السر.";return}
  try{
    if(setMode){
      if(v!==document.getElementById("pp2").value.trim()){m.textContent="كلمتا السر غير متطابقتين.";return}
      var salt=Array.from(crypto.getRandomValues(new Uint8Array(8))).map(function(x){return x.toString(16).padStart(2,"0")}).join(""),rec={h:await sha(v,salt),salt:salt};
      if(db)await db.doc("config/pin").set(rec);pinDoc=rec;
    }else{
      if(Date.now()<lockUntil){m.textContent="محاولات كثيرة. انتظر نصف دقيقة وحاول مجدداً.";return}
      var okp=(await sha(v,pinDoc.salt))===pinDoc.h;if(!okp&&/^[\x20-\x7e]+$/.test(v))okp=(await sha(latinToAr(v),pinDoc.salt))===pinDoc.h;if(!okp&&/[\u0600-\u06FF]/.test(v))okp=(await sha(arToLatin(v),pinDoc.salt))===pinDoc.h;
      if(!okp){tries++;if(tries>=5){tries=0;lockUntil=Date.now()+30000}m.textContent="كلمة السر غير صحيحة.";return}
    }
    unlocked=true;var cb=gateCb;closeGate();if(cb)cb();
  }catch(err){m.textContent="تعذر التحقق حالياً. حاول مرة أخرى."}
});

async function initFB(){
  try{
    var B="https://www.gstatic.com/firebasejs/10.12.2/";
    var A=await import(B+"firebase-app.js"),F=await import(B+"firebase-firestore.js");fbU=await import(B+"firebase-auth.js");
    var app=A.initializeApp(FB_CONFIG),fs=F.getFirestore(app);fbAuth=fbU.getAuth(app);
    var ad={collection:function(n){return{
        onSnapshot:function(cb,er){return F.onSnapshot(F.collection(fs,n),function(sn){cb({empty:sn.empty,docs:sn.docs.map(function(x){return{id:x.id,data:function(){return x.data()}}})})},er)},
        doc:function(){var r=F.doc(F.collection(fs,n));return{id:r.id,set:function(v){return F.setDoc(r,v)}}}}},
      doc:function(pth){var r=F.doc(fs,pth);return{set:function(v){return F.setDoc(r,v)},delete:function(){return F.deleteDoc(r)},get:async function(){var x=await F.getDoc(r);return{exists:x.exists(),data:function(){return x.data()}}}}}};
    var isEmpty=false;
    fbSeed=async function(){if(!isEmpty||!unlocked)return;isEmpty=false;
      for(var i=0;i<SNAP.length;i+=400){var b=F.writeBatch(fs);SNAP.slice(i,i+400).forEach(function(v){var o=Object.assign({},v);delete o.id;b.set(F.doc(fs,"events",v.id),o)});await b.commit()}};
    fbU.onAuthStateChanged(fbAuth,function(us){unlocked=!!us;document.getElementById("outBtn").hidden=!us;if(unlocked)fbSeed()});
    document.getElementById("outBtn").onclick=function(){fbU.signOut(fbAuth)};
    fbMode=true;
    ad.collection("events").onSnapshot(function(snap){
      db=ad;localMode=false;isEmpty=snap.empty;
      if(!snap.empty)events=snap.docs.map(function(x){var v=x.data();return{id:x.id,s:v.s,e:v.e||v.s,t:v.t,k:v.k,kn:v.kn,kc:v.kc,done:!!v.done,doc:!!v.doc,post:!!v.post,ds:Array.isArray(v.ds)&&v.ds.length?v.ds:null}});
      setWrite(true);render();if(isEmpty)fbSeed();
    },function(){document.getElementById("note").innerHTML='<div class="note">تعذر الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase.</div>'});
  }catch(e){document.getElementById("note").innerHTML='<div class="note">تعذر تحميل Firebase.</div>'}
}
